[pytest]
markers =
    auth: 认证相关测试
    problem: 题目相关测试
    submission: 提交代码测试
    run: 自定义用例运行测试
    admin: 管理员功能测试
    negative: 负面测试场景
    slow: 耗时较长的测试

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

filterwarnings =
    ignore::DeprecationWarning

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*