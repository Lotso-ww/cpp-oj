<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#FAFAF7" />
  <meta name="description" content="在 CPP·OJ 上阅读题目、编写 C++ 代码并提交判题。" />
  <title>题目 · CPP·OJ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="page" role="main">

    <header class="topbar">
      <div class="topbar__inner">
        <a href="/index.html" class="wordmark" aria-label="CPP OJ — 首页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19h8" />
            <path d="m4 17 6-6-6-6" />
            <path d="m12 11 6 6" />
          </svg>
          <span>CPP&nbsp;·&nbsp;OJ</span>
        </a>
        <nav class="nav" aria-label="主导航">
          <a href="/problem_list.html" class="nav__item is-active" aria-current="page">题目</a>
          <a href="#" class="nav__item" aria-disabled="true">排行</a>
          <a href="#" class="nav__item" aria-disabled="true">讨论</a>
        </nav>
        <div class="user-menu" id="userMenu">
          <!-- Filled by JS -->
        </div>
      </div>
    </header>

    <div class="container">

      <header class="page-header">
        <a href="/problem_list.html" class="page-header__back" aria-label="返回题目列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="2">
            <path d="M19 12H5" />
            <path d="m12 19-7-7 7-7" />
          </svg>
          <span>返回列表</span>
        </a>
        <span class="page-header__eyebrow">
          <span class="dot" aria-hidden="true"></span>
          <span id="problemEyebrow">题库 · 题目</span>
        </span>
        <h1 class="page-header__heading" id="problemTitle">加载中…</h1>
        <div class="page-header__meta" id="problemMeta"></div>
      </header>

      <div class="problem-layout">

        <article class="problem-layout__main" aria-label="题目描述">
          <div class="problem-content" id="problemContent" aria-busy="true">
            <p class="skeleton skeleton--title" style="width:90%"></p>
            <p class="skeleton skeleton--title" style="width:70%"></p>
            <p class="skeleton skeleton--title" style="width:85%"></p>
            <p class="skeleton skeleton--title" style="width:60%"></p>
            <p class="skeleton skeleton--title" style="width:75%"></p>
          </div>
        </article>

        <aside class="problem-layout__editor" aria-label="代码编辑器">

          <p class="editor-label">C++ 代码</p>
          <div class="editor" id="editor"></div>

          <div class="editor-actions">
            <button class="btn btn--ghost" id="resetBtn" type="button">重置</button>
            <button class="btn btn--primary" id="submitBtn" type="button">
              <span class="btn__label">
                <span>提交</span>
                <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-width="2">
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
              </span>
              <span class="btn__loader" aria-hidden="true">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              </span>
            </button>
          </div>

          <p class="auth-hint" id="authHint" hidden>
            登录后即可提交代码。
            <a href="/login.html" id="authHintLink">登录</a>
          </p>

          <div id="resultArea" aria-live="polite"></div>

        </aside>

      </div>

    </div>

  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!--
    Inline script: update login link href immediately, before external JS loads.
    Ensures the link has the correct ?return= param even if api.js / problem_detail.js
    fail to load, so the user always comes back to the right page after login.
  -->
  <script>
    (function () {
      try {
        var link = document.getElementById('authHintLink');
        if (link) {
          var ret = encodeURIComponent(window.location.pathname + window.location.search);
          link.href = '/login.html?return=' + ret;
        }
      } catch (_) {}
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.7/src-noconflict/ace.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.7/src-noconflict/mode-c_cpp.js" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="/js/problem_detail.js"></script>
</body>
</html>
